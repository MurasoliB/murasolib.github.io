<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Murasoli Balaji Portfolio</title>
    <script type="text/javascript">
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        var pathname = l.pathname || '/';
        // Mitigate open-redirect attacks: prevent protocol-relative '//' paths
        while (pathname.indexOf('//') === 0) {
          pathname = pathname.substring(1);
        }
        if (pathname.charAt(0) !== '/') {
          pathname = '/' + pathname;
        }
        var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body style="background:#050505;color:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
    <p>Redirecting to Murasoli Balaji Portfolio...</p>
  </body>
</html>
