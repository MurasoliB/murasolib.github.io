name: Daily Activity Heartbeat

on:
  schedule:
    # Runs daily at 18:40 UTC (12:10 AM IST) on GitHub's cloud servers even when offline
    - cron: '40 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Heartbeat Timestamp
        run: |
          mkdir -p .github
          TZ="Asia/Kolkata" date +"Last heartbeat: %Y-%m-%d %H:%M:%S IST" > .github/heartbeat.txt

      - name: Commit & Push
        run: |
          git config user.name "MurasoliB"
          git config user.email "balajimurasoli@gmail.com"
          git add .github/heartbeat.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily heartbeat $(TZ="Asia/Kolkata" date +%Y-%m-%d)"
            git push
          fi
